name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate syntax
        run: |
          node --check notify.cjs
          node -e "JSON.parse(require('fs').readFileSync('hooks.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin.json', 'utf8'))"
